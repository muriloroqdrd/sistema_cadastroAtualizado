
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Pedido</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="titulo-formulario">
            <h2>Novo Pedido</h2>
            <p>Preencha os dados do cliente e da placa</p>
        </div>

        <form method="POST" class="formulario">

            <label for="nome">Nome do Cliente</label>
            <input type="text" id="nome" name="nome" required>

            <label for="gravacao">Gravação</label>
            <input type="text" id="gravacao" name="gravacao">

            <label for="numero">Número da Placa</label>
            <input type="text" id="numero" name="numero">

            <label for="cor">Cor</label>
            <input type="text" id="cor" name="cor">

            <label for="tamanho">Tamanho</label>
            <input type="text" id="tamanho" name="tamanho">

            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes"></textarea>

            <div class="area-botoes">

                <a href="/" class="btn-voltar">
                    Voltar
                </a>

                <button type="submit" class="btn-salvar">
                    Salvar Pedido
                </button>

            </div>

        </form>

    </div>

</body>
</html>
